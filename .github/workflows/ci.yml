name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar frontmatter de los agentes
        run: node scripts/validar-agentes.js

      - name: Probar los hooks
        run: node --test scripts/test-hooks.js

      - name: Probar el verificador de contrato de proyecto
        run: node --test scripts/test-verificar-proyecto.js

      - name: Revisar los workflows
        run: node scripts/validar-workflows.js
